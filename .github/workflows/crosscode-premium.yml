name: Build CrossCode Premium Touch
on:
  push:
    branches: [crosscode-premium]
    paths:
      - 'crosscode-premium/**'
      - '.github/workflows/crosscode-premium.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Retrieve pinned open CrossDroid source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/dain98/CrossDroid.git upstream
          git -C upstream checkout --detach b80464bc24c66e90acb7e66831f677606119cc4a

      - name: Apply CrossCode premium controls patch
        shell: bash
        run: |
          set -euo pipefail
          python3 crosscode-premium/apply.py upstream
          grep -n 'PremiumControls' upstream/app/src/main/java/de/radicalfishgames/crosscode/features/VirtualControllerFeature.kt
          grep -n 'PremiumControls' upstream/app/src/main/java/de/radicalfishgames/crosscode/overlay/ControlView.kt
          grep -n 'applicationId ' upstream/app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        shell: bash
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Compile CrossCode Premium APK
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          chmod +x gradlew
          bash ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/crosscode-build.log"

      - name: Provide installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CrossCode-Premium-S23-debug
          path: upstream/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CrossCode-premium-build-log
          path: crosscode-build.log
          if-no-files-found: ignore
