name: Build RadicalFish S23
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: moronigranja/alabaster-android
          ref: main
          path: source
      - name: Patch S23 touch opacity safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/android/app/src/main/java/io/github/moronigranja/alabasterdawn/OnScreenPadView.kt')
          s=p.read_text()
          needle='    /** Fired on every commit (DONE, detach, background), so the Activity can persist the layout. */'
          assert needle in s, 'Upstream source changed: missing insertion marker'
          s=s.replace(needle, '    var controlsOpacity: Float = 0.75f\n        set(value) { field = value.coerceIn(0.20f, 1.0f); invalidate() }\n\n'+needle,1)
          begin='        if (drawn || model.editing) {'
          assert begin in s
          s=s.replace(begin,begin+'\n            val s23Layer = canvas.saveLayerAlpha(0f, 0f, width.toFloat(), height.toFloat(), ((if (model.editing) 1f else controlsOpacity) * 255f).toInt())',1)
          end='            drawControlPill(canvas, OnScreenPadModel.HOME, "HOME")'
          assert end in s
          s=s.replace(end,end+'\n            canvas.restoreToCount(s23Layer)',1)
          p.write_text(s)
          print('S23 patch applied; Kotlin indentation preserved')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compile debug APK and run tests
        working-directory: source/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: RadicalFish-S23-debug
          path: source/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
