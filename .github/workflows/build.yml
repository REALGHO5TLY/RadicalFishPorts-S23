name: Build RadicalFish S23 Premium
on:
  push:
    branches: [main]
    paths:
      - 'RadicalFish_S23_Fullscreen_Modes_Source.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout S23 repository
        uses: actions/checkout@v4
      - name: Verify and unpack complete premium source
        run: |
          test -s RadicalFish_S23_Fullscreen_Modes_Source.zip || { echo "Upload RadicalFish_S23_Fullscreen_Modes_Source.zip to repository root first"; exit 1; }
          unzip -t RadicalFish_S23_Fullscreen_Modes_Source.zip
          mkdir -p source
          unzip -q RadicalFish_S23_Fullscreen_Modes_Source.zip -d source
          test -f source/android/gradlew
          test -f source/android/app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compile debug APK and run unit tests
        working-directory: source/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RadicalFish-S23-Premium-debug
          path: source/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
