name: Build RadicalFish S23 Premium
on:
  push:
    branches: [main]
    paths:
      - 'RadicalFish_S23_Fullscreen_Modes_Source.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout S23 repository
        uses: actions/checkout@v4
      - name: Verify and unpack complete premium source
        shell: bash
        run: |
          set -o pipefail
          {
            echo "Repository files:"
            ls -lah
            echo "ZIP identification:"
            file RadicalFish_S23_Fullscreen_Modes_Source.zip
            echo "ZIP file listing:"
            unzip -Z1 RadicalFish_S23_Fullscreen_Modes_Source.zip | head -n 35
            echo "ZIP integrity:"
            unzip -tq RadicalFish_S23_Fullscreen_Modes_Source.zip
            mkdir -p source
            unzip -oq RadicalFish_S23_Fullscreen_Modes_Source.zip -d source
            echo "Extracted source:"
            ls -lah source/
            echo "Android project:"
            ls -lah source/android/
            test -f source/android/gradlew
            test -f source/android/app/build.gradle.kts
          } 2>&1 | tee "$GITHUB_WORKSPACE/preparation.log"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        shell: bash
        run: |
          set -o pipefail
          echo "SDK manager: $(command -v sdkmanager)" | tee "$GITHUB_WORKSPACE/sdk-setup.log"
          yes | sdkmanager --licenses 2>&1 | tee -a "$GITHUB_WORKSPACE/sdk-setup.log" || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" 2>&1 | tee -a "$GITHUB_WORKSPACE/sdk-setup.log"
      - name: Compile debug APK and run unit tests
        working-directory: source/android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/android-build.log"
      - name: Save failed build log into repository
        if: failure()
        run: |
          mkdir -p build-diagnostics
          if [ -f preparation.log ]; then
            cat preparation.log > build-diagnostics/latest.txt
          else
            printf 'Preparation step did not run.\\n' > build-diagnostics/latest.txt
          fi
          if [ -f sdk-setup.log ]; then
            echo "=== SDK setup ===" >> build-diagnostics/latest.txt
            cat sdk-setup.log >> build-diagnostics/latest.txt
          fi
          if [ -f android-build.log ]; then
            tail -n 500 android-build.log >> build-diagnostics/latest.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-diagnostics/latest.txt
          git commit -m 'Capture latest S23 build failure diagnostics' || true
          git push origin HEAD:main
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RadicalFish-S23-Premium-debug
          path: source/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
