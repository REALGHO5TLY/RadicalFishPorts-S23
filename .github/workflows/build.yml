name: Build RadicalFish S23 APK
on:
  push:
    branches: [main]
    paths:
      - 'RadicalFish_S23_Fullscreen_Modes_Source.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Android source
        shell: bash
        run: |
          set -euo pipefail
          test -s RadicalFish_S23_Fullscreen_Modes_Source.zip
          unzip -tq RadicalFish_S23_Fullscreen_Modes_Source.zip
          mkdir -p source
          unzip -oq RadicalFish_S23_Fullscreen_Modes_Source.zip -d source
          test -f source/android/gradlew
          test -f source/android/app/build.gradle.kts
          echo "Android source ready"
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: source/android/**/*.gradle*
      - name: Install Android 36 SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          manager_path=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -n "$manager_path"
          yes | "$manager_path" --licenses >/dev/null || true
          "$manager_path" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Build APK
        shell: bash
        working-directory: source/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
      - name: Upload installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RadicalFish-S23-Premium-debug
          path: source/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Save build diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p build-diagnostics
          {
            echo "Run: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "Build URL: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            if [ -f build.log ]; then tail -n 600 build.log; else echo "Failure before Gradle; see run URL for failed step."; fi
          } > build-diagnostics/latest.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-diagnostics/latest.txt
          git commit -m 'Record failed APK build diagnostics' || true
          git push origin HEAD:main || true
