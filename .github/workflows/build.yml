name: Build RadicalFish S23 Premium
on:
  push:
    branches: [main]
    paths:
      - 'RadicalFish_S23_Fullscreen_Modes_Source.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout S23 repository
        uses: actions/checkout@v4
      - name: Verify and unpack complete premium source
        run: |
          test -s RadicalFish_S23_Fullscreen_Modes_Source.zip || { echo "Upload RadicalFish_S23_Fullscreen_Modes_Source.zip to repository root first"; exit 1; }
          unzip -t RadicalFish_S23_Fullscreen_Modes_Source.zip
          mkdir -p source
          unzip -q RadicalFish_S23_Fullscreen_Modes_Source.zip -d source
          echo 'Unpacked top-level files:'
          ls -la source
          echo 'Android files:'
          ls -la source/android || true
          test -f source/android/gradlew
          test -f source/android/app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compile debug APK and run unit tests
        working-directory: source/android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/android-build.log"
      - name: Save failed build log into repository
        if: failure()
        run: |
          mkdir -p build-diagnostics
          if [ -f android-build.log ]; then
            tail -n 500 android-build.log > build-diagnostics/latest.txt
          else
            printf 'Build failed before Gradle started. Inspect verification step and ZIP structure.\n' > build-diagnostics/latest.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-diagnostics/latest.txt
          git commit -m 'Capture latest S23 build failure diagnostics' || true
          git push origin HEAD:main
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RadicalFish-S23-Premium-debug
          path: source/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
